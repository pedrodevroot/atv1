name: cinebridge

services:
  postgres:
    image: postgres:18-alpine
    container_name: cinebridge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-postgres}
      RECOMENDACAO_DB_USER: ${DB_USER:-recomendacao}
      RECOMENDACAO_DB_PASSWORD: ${DB_PASSWORD:-recomendacao}
      RECOMENDACAO_DB_NAME: ${DB_NAME:-cinebridge_recomendacao}
    ports:
      - '${POSTGRES_HOST_PORT:-5434}:5432'
    volumes:
      - cinebridge-pgdata:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - cinebridge
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d postgres']
      interval: 5s
      timeout: 3s
      retries: 10

  recomendacao:
    build: .
    image: cinebridge/recomendacao:local
    container_name: cinebridge-recomendacao
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-recomendacao}
      DB_PASSWORD: ${DB_PASSWORD:-recomendacao}
      DB_NAME: ${DB_NAME:-cinebridge_recomendacao}
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
      DB_TIMEOUT_MS: ${DB_TIMEOUT_MS:-2000}
    ports:
      - '${RECOMENDACAO_HOST_PORT:-3000}:3000'
    networks:
      - cinebridge

networks:
  cinebridge:
    name: cinebridge

volumes:
  cinebridge-pgdata:
    name: cinebridge-pgdata
